<style>
  :root{
    --notte-alta:#120a35; --notte-media:#24104f; --notte-bassa:#060418;
    --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;cursor:none;
    background-color:var(--notte-bassa);
    background-image:
      radial-gradient(70% 55% at 50% 48%, rgba(110,52,190,.42), transparent 70%),
      linear-gradient(180deg,var(--notte-alta),var(--notte-media) 55%,var(--notte-bassa));
  }
  #scena{position:fixed;inset:0;width:100%;height:100%;display:block}
  #unicorno{
    position:fixed;left:0;top:0;width:220px;height:176px;
    transform:translate(-600px,-600px);
    will-change:transform;pointer-events:none;overflow:visible;
    filter:drop-shadow(0 0 14px rgba(255,190,240,.35)) drop-shadow(0 10px 22px rgba(30,8,80,.6));
  }
  .gamba,.coda,.criniera{transform-box:view-box}
  .g-an{transform-origin:208px 118px;animation:anteriore .46s ease-in-out infinite alternate}
  .g-al{transform-origin:198px 122px;animation:anteriore .46s ease-in-out infinite alternate-reverse}
  .g-pn{transform-origin:100px 118px;animation:posteriore .46s ease-in-out infinite alternate}
  .g-pl{transform-origin:114px 122px;animation:posteriore .46s ease-in-out infinite alternate-reverse}
  .coda{transform-origin:96px 98px;animation:coda .5s ease-in-out infinite alternate}
  .criniera{transform-origin:210px 52px;animation:criniera .5s ease-in-out infinite alternate}
  @keyframes anteriore{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
  @keyframes posteriore{from{transform:rotate(20deg)}to{transform:rotate(-16deg)}}
  @keyframes coda{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
  @keyframes criniera{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){.gamba,.coda,.criniera{animation:none}}
  #porta{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:0 16px;text-align:center;cursor:pointer;color:#ffd6f5;background:rgba(10,5,30,.7);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:opacity .7s}
  #porta.via{opacity:0;pointer-events:none}
  #porta .invito{font:800 clamp(30px,6vw,68px)/1.1 var(--display);animation:respira 1.6s ease-in-out infinite alternate}
  #porta .sotto{font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  @keyframes respira{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>

<script>
(function(){
  "use strict";
  var tela=document.getElementById('scena'), ctx=tela.getContext('2d');
  var uni=document.getElementById('unicorno');
  var ridotto=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var FONT='"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif';
  var PAROLA=(function(){ var f=new URLSearchParams(location.search).get('frase')||''; f=f.split(' ').filter(Boolean).join(' ').toUpperCase().slice(0,60); return f||'SEI UN COGLIONE'; })();
  var CORNO=[260/300,1/240], GROPPA=[92/300,104/240];
  var W=0,H=0,dpr=1,uw=220,uh=176,vel=240;
  var stelle=[],bersagli=[],scintille=[],sprite=[];
  var raggio=4, box={l:0,r:0,t:0,b:0,cy:0,h:0}, lettere=8;
  var fase='scrive', tFase=0, tempo=0, ultimo=0, accumulo=0;
  var ux=-600,uy=-600,vx=0,vy=0,flip=1,ang=0,prossimo=0;
  var da=0,a=0,durata=4,onde=8;

  function preparaSprite(){
    sprite=[];
    for(var i=0;i<36;i++){
      var c=document.createElement('canvas'); c.width=c.height=64;
      var g=c.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32), hue=i*10;
      gr.addColorStop(0,'hsla('+hue+',100%,96%,1)');
      gr.addColorStop(.22,'hsla('+hue+',100%,72%,.95)');
      gr.addColorStop(.5,'hsla('+hue+',100%,62%,.32)');
      gr.addColorStop(1,'hsla('+hue+',100%,60%,0)');
      g.fillStyle=gr; g.fillRect(0,0,64,64);
      sprite.push(c);
    }
  }
  function brilla(x,y,r,hue,al){
    var s=sprite[((Math.round(hue/10)%36)+36)%36];
    ctx.globalAlpha=al; ctx.drawImage(s,x-r*2,y-r*2,r*4,r*4);
  }
  function righe(t,max){
    var out=[],cur='';
    t.split(' ').forEach(function(p){
      if(!cur) cur=p;
      else if((cur+' '+p).length<=max) cur+=' '+p;
      else { out.push(cur); cur=p; }
    });
    if(cur) out.push(cur);
    return out;
  }
  function preparaParola(){
    var lin=righe(PAROLA, W<600?10:16);
    lettere=PAROLA.replace(/ /g,'').length;
    var off=document.createElement('canvas'); off.width=W; off.height=H;
    var o=off.getContext('2d',{willReadFrequently:true});
    o.font='800 100px '+FONT;
    var largo=1;
    lin.forEach(function(l){ largo=Math.max(largo,o.measureText(l).width); });
    var fs=Math.min(100*W*0.86/largo, H*0.46/lin.length, 230);
    o.font='800 '+fs+'px '+FONT; o.textAlign='center'; o.textBaseline='middle'; o.fillStyle='#fff';
    lin.forEach(function(l,i){ o.fillText(l, W/2, H*0.5+(i-(lin.length-1)/2)*fs*0.98); });
    var d=o.getImageData(0,0,W,H).data;
    var passo=Math.max(4,Math.round(fs/17)), lista;
    for(;;){
      lista=[];
      for(var y=0;y<H;y+=passo) for(var x=0;x<W;x+=passo)
        if(d[(y*W+x)*4+3]>140) lista.push({tx:x,ty:y});
      if(lista.length>2600) passo++; else break;
    }
    var l=1e9,r=-1e9,t=1e9,b=-1e9;
    lista.forEach(function(p){
      p.tx+=(Math.random()-.5)*passo*.45; p.ty+=(Math.random()-.5)*passo*.45;
      l=Math.min(l,p.tx); r=Math.max(r,p.tx); t=Math.min(t,p.ty); b=Math.max(b,p.ty);
    });
    if(!lista.length){ l=W*.4; r=W*.6; t=H*.45; b=H*.55; }
    lista.forEach(function(p){
      p.hue=(330+(p.tx-l)/((r-l)||1)*300)%360; p.f=Math.random()*6.283; p.stato=0;
    });
    lista.sort(function(p,q){ return p.tx-q.tx; });
    bersagli=lista; raggio=passo*0.62;
    box={l:l,r:r,t:t,b:b,cy:(t+b)/2,h:b-t};
  }
  function misura(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    tela.width=Math.round(W*dpr); tela.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    uw=W<560 ? Math.round(W*0.38) : Math.round(Math.min(250,Math.max(170,W*0.17)));
    uh=uw*0.8;
    uni.style.width=uw+'px'; uni.style.height=uh+'px';
    vel=Math.max(170,Math.min(420,W*0.24))*(ridotto?0.6:1);
    stelle=[];
    var n=Math.round(W*H/5200);
    for(var i=0;i<n;i++) stelle.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.3,f:Math.random()*6.283,v:.5+Math.random()*1.8});
    preparaParola();
  }
  function daCorno(hx,hy,f,an){
    var lx=(CORNO[0]-.5)*uw*f, ly=(CORNO[1]-.5)*uh, c=Math.cos(an), s=Math.sin(an);
    return [hx-uw/2-(lx*c-ly*s), hy-uh/2-(lx*s+ly*c)];
  }
  function puntoDi(rel){
    var lx=(rel[0]-.5)*uw*flip, ly=(rel[1]-.5)*uh, c=Math.cos(ang), s=Math.sin(ang);
    return [ux+uw/2+lx*c-ly*s, uy+uh/2+lx*s+ly*c];
  }
  function iniziaScrittura(){
    fase='scrive'; tFase=0; prossimo=0; scintille=[];
    bersagli.forEach(function(b){ b.stato=0; });
    da=-uw*0.15; a=box.r+uw*0.35;
    durata=Math.min(7,Math.max(3.4,(a-da)/(vel*1.15)));
    onde=Math.max(3,lettere);
  }
  function lancia(b,hx,hy){
    b.stato=1; b.t0=tempo; b.dur=.5+Math.random()*.45;
    b.sx=hx; b.sy=hy; b.x=hx; b.y=hy;
    b.cx=(hx+b.tx)/2+(Math.random()-.5)*90;
    b.cy=Math.min(hy,b.ty)-20-Math.random()*70;
  }
  function esplodi(){
    bersagli.forEach(function(b){
      var x=b.stato===1?b.x:b.tx, y=b.stato===1?b.y:b.ty;
      var dx=x-W/2, dy=y-box.cy, n=Math.hypot(dx,dy)||1, s=120+Math.random()*320;
      b.x=x; b.y=y; b.vx=dx/n*s+(Math.random()-.5)*120; b.vy=dy/n*s-80-Math.random()*220;
      b.vita=1; b.stato=3;
    });
  }
  function aggiorna(dt){
    tFase+=dt;
    audio();
    if(fase==='scrive'){
      var p=Math.min(1,tFase/durata), k=Math.PI*onde;
      var hx=da+(a-da)*p, hy=box.cy+Math.sin(p*k)*box.h*0.42;
      var dx=(a-da)/durata, dy=Math.cos(p*k)*k/durata*box.h*0.42;
      flip=1;
      var mira=Math.max(-.38,Math.min(.38,Math.atan2(dy,dx)*0.5));
      ang+=(mira-ang)*Math.min(1,dt*10);
      var pos=daCorno(hx,hy,flip,ang); ux=pos[0]; uy=pos[1];
      while(prossimo<bersagli.length && bersagli[prossimo].tx<=hx+raggio*2){ lancia(bersagli[prossimo],hx,hy); prossimo++; }
      if(p>=1){
        while(prossimo<bersagli.length){ lancia(bersagli[prossimo],hx,hy); prossimo++; }
        fase='libero'; tFase=0; vx=vel; vy=(Math.random()<.5?-1:1)*vel*.55;
      }
    } else {
      ux+=vx*dt; uy+=vy*dt;
      if(ux<0){ ux=0; vx=Math.abs(vx); }
      if(fase==='libero' && ux>W-uw){ ux=W-uw; vx=-Math.abs(vx); }
      if(uy<0){ uy=0; vy=Math.abs(vy); }
      if(uy>H-uh){ uy=H-uh; vy=-Math.abs(vy); }
      flip=vx<0?-1:1;
      var mira2=Math.max(-.3,Math.min(.3,flip*Math.atan2(vy,Math.abs(vx))*0.45));
      ang+=(mira2-ang)*Math.min(1,dt*6);
      if(fase==='libero' && tFase>(ridotto?10:8)){
        fase='esce'; tFase=0; vx=Math.abs(vx)*1.5+vel*.3; vy*=.4; esplodi();
      }
      if(fase==='esce' && ux>W+30 && tFase>1.9) iniziaScrittura();
    }
    accumulo+=dt*(ridotto?18:42);
    while(accumulo>=1){
      accumulo--;
      var g=puntoDi(GROPPA);
      scintille.push({x:g[0],y:g[1],vx:-flip*(30+Math.random()*50),vy:(Math.random()-.3)*40,vita:1,hue:(tempo*140)%360,r:2+Math.random()*2.6});
    }
    for(var i=scintille.length-1;i>=0;i--){
      var s=scintille[i];
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=30*dt; s.vita-=dt/0.9;
      if(s.vita<=0) scintille.splice(i,1);
    }
    for(var j=0;j<bersagli.length;j++){
      var b=bersagli[j];
      if(b.stato===1){
        var u=Math.min(1,(tempo-b.t0)/b.dur), e=1-Math.pow(1-u,3), m=1-e;
        b.x=m*m*b.sx+2*m*e*b.cx+e*e*b.tx;
        b.y=m*m*b.sy+2*m*e*b.cy+e*e*b.ty;
        if(u>=1) b.stato=2;
      } else if(b.stato===3){
        b.vy+=520*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.vita-=dt/1.7;
      }
    }
  }
  function disegna(){
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fff3d6';
    for(var i=0;i<stelle.length;i++){
      var st=stelle[i];
      ctx.globalAlpha=.22+.55*(.5+.5*Math.sin(tempo*st.v+st.f));
      ctx.fillRect(st.x,st.y,st.r*1.6,st.r*1.6);
    }
    ctx.globalCompositeOperation='lighter';
    for(var j=0;j<bersagli.length;j++){
      var b=bersagli[j];
      if(b.stato===1) brilla(b.x,b.y,raggio*1.1,b.hue,1);
      else if(b.stato===2) brilla(b.tx,b.ty,raggio*(.82+.22*Math.sin(tempo*4.5+b.f)),b.hue,.95);
      else if(b.stato===3 && b.vita>0) brilla(b.x,b.y,raggio*(.6+.4*b.vita),b.hue,b.vita);
    }
    for(var k=0;k<scintille.length;k++){
      var s=scintille[k];
      brilla(s.x,s.y,s.r,s.hue,Math.max(0,s.vita));
    }
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    var saltello=fase==='scrive'?0:Math.sin(tempo*10)*uh*0.025;
    uni.style.transform='translate('+ux.toFixed(1)+'px,'+(uy+saltello).toFixed(1)+'px) rotate('+ang.toFixed(3)+'rad) scaleX('+flip+')';
  }
  // ---- audio: tutto sintetizzato al momento, nessun file da scaricare ----
  var Suono=(function(){
    var ac=null, uscita=null, rumore=null;
    function avvia(){
      if(ac) return;
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return;
      ac=new C();
      var comp=ac.createDynamicsCompressor();
      comp.threshold.value=-14; comp.ratio.value=4; comp.connect(ac.destination);
      uscita=ac.createGain(); uscita.gain.value=.85; uscita.connect(comp);
      var n=ac.sampleRate*2, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
      rumore=b;
      if(ac.state==='suspended') ac.resume();
    }
    function inviluppo(g,t,vol,att,dur){
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+att);
      g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(att+.01,dur));
    }
    function tono(o){
      if(!ac) return;
      var t=ac.currentTime+(o.ritardo||0), osc=ac.createOscillator(), g=ac.createGain(), dopo=g;
      osc.type=o.tipo||'sine';
      osc.frequency.setValueAtTime(o.f,t);
      if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||o.durata));
      inviluppo(g,t,o.vol||.1,o.attacco||.005,o.durata);
      if(o.filtro){ var fl=ac.createBiquadFilter(); fl.type=o.filtro; fl.frequency.value=o.ff||1000; fl.Q.value=o.q||1; g.connect(fl); dopo=fl; }
      osc.connect(g); dopo.connect(uscita);
      osc.start(t); osc.stop(t+o.durata+.05);
    }
    function soffio(o){
      if(!ac) return;
      var t=ac.currentTime+(o.ritardo||0), src=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain();
      src.buffer=rumore; src.loop=true;
      fl.type=o.filtro||'bandpass'; fl.frequency.setValueAtTime(o.f,t); fl.Q.value=o.q||1;
      if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+o.durata);
      inviluppo(g,t,o.vol||.1,o.attacco||.005,o.durata);
      src.connect(fl); fl.connect(g); g.connect(uscita);
      src.start(t,Math.random()*1.5); src.stop(t+o.durata+.05);
    }
    function fondo(o){
      if(!ac) return null;
      var src=ac.createBufferSource(), fl=ac.createBiquadFilter(), g=ac.createGain(), dopo=fl;
      src.buffer=rumore; src.loop=true;
      fl.type=o.filtro||'bandpass'; fl.frequency.value=o.f; fl.Q.value=o.q||1;
      if(o.am){
        var m=ac.createGain(), lfo=ac.createOscillator(), prof=ac.createGain();
        m.gain.value=.5; prof.gain.value=.5; lfo.frequency.value=o.am;
        lfo.connect(prof); prof.connect(m.gain); fl.connect(m); dopo=m; lfo.start();
      }
      g.gain.value=0;
      src.connect(fl); dopo.connect(g); g.connect(uscita); src.start(0,Math.random()*1.5);
      return {filtro:fl, vol:function(v,dolce){ g.gain.setTargetAtTime(v,ac.currentTime,dolce||.15); }};
    }
    function tenuto(o){
      if(!ac) return null;
      var osc=ac.createOscillator(), g=ac.createGain(), dopo=g;
      osc.type=o.tipo||'sine'; osc.frequency.value=o.f; osc.detune.value=o.detune||0;
      g.gain.value=0;
      if(o.filtro){ var fl=ac.createBiquadFilter(); fl.type=o.filtro; fl.frequency.value=o.ff; fl.Q.value=o.q||.7; g.connect(fl); dopo=fl; }
      osc.connect(g); dopo.connect(uscita); osc.start();
      return {osc:osc, vol:function(v,dolce){ g.gain.setTargetAtTime(v,ac.currentTime,dolce||.15); }};
    }
    function campana(f,vol,dur,parziali,ritardo){
      (parziali||[1,2.76,5.4,8.93]).forEach(function(p,i){ tono({f:f*p,vol:vol/(i+1),durata:dur/(1+i*.5),attacco:.003,ritardo:ritardo||0}); });
    }
    return {avvia:avvia, tono:tono, soffio:soffio, fondo:fondo, tenuto:tenuto, campana:campana,
      attivo:function(){ return !!ac; }, ac:function(){ return ac; }, uscita:function(){ return uscita; }};
  })();
  var ultimiSuoni={};
  function ogni(nome,intervallo){
    if(!Suono.attivo()) return false;
    var t=Suono.ac().currentTime, prima=ultimiSuoni[nome]===undefined?-99:ultimiSuoni[nome];
    if(t-prima<intervallo) return false;
    ultimiSuoni[nome]=t; return true;
  }

  // ---- i suoni dell'unicorno ----
  var PENTA=[0,2,4,7,9], faseSentita='', lanciSentiti=0, passoZ=0;
  function nota(g,base){ return (base||523.25)*Math.pow(2,(12*Math.floor(g/5)+PENTA[((g%5)+5)%5])/12); }
  function ambiente(){
    [261.63,329.63,392,493.88].forEach(function(f,i){
      var p=Suono.tenuto({f:f,tipo:'triangle',filtro:'lowpass',ff:1100,detune:(i-1.5)*5});
      if(p) p.vol(.014,2);
    });
  }
  function ricomincia(){ iniziaScrittura(); faseSentita=''; }
  function audio(){
    if(!Suono.attivo()) return;
    if(fase!==faseSentita){
      if(fase==='scrive'){
        lanciSentiti=0;
        for(var i=0;i<10;i++) Suono.tono({f:nota(i),tipo:'triangle',vol:.05,durata:.9,ritardo:i*.045});
      }
      if(fase==='esce'){
        Suono.tono({f:110,f2:38,vol:.5,durata:.6,attacco:.003});
        Suono.soffio({f:400,f2:4500,q:.9,vol:.22,durata:.7,attacco:.05});
        for(var k=0;k<14;k++) Suono.tono({f:nota(8+Math.floor(Math.random()*8)),vol:.03,durata:.5,ritardo:Math.random()*.6});
      }
      faseSentita=fase;
    }
    if(fase==='scrive' && prossimo>lanciSentiti){
      lanciSentiti=prossimo;
      if(ogni('scintilla',.05)){
        var b=bersagli[prossimo-1], p=Math.max(0,Math.min(1,(b.tx-box.l)/((box.r-box.l)||1))), f=nota(Math.round(p*12)+2);
        Suono.tono({f:f,vol:.035,durata:.6}); Suono.tono({f:f*2.01,vol:.012,durata:.3});
      }
    }
    if(fase!=='scrive' && ogni('zoccolo',.19)){
      passoZ^=1;
      Suono.soffio({f:2400,q:3,vol:.045,durata:.04,attacco:.002});
      Suono.tono({f:passoZ?760:640,f2:300,vol:.03,durata:.06});
    }
  }

  function ciclo(ora){
    var dt=Math.min(.05,Math.max(0,(ora-ultimo)/1000));
    ultimo=ora; tempo+=dt;
    aggiorna(dt); disegna();
    requestAnimationFrame(ciclo);
  }
  var partito=false;
  function avvia(){
    if(partito) return; partito=true;
    preparaSprite(); misura(); iniziaScrittura();
    if(/prova/.test(location.search)){ Suono.avvia(); ambiente(); }
    var salta=/salta=([\d.]+)/.exec(location.search);
    if(salta) for(var i=Math.round(parseFloat(salta[1])*60);i>0;i--){ tempo+=1/60; aggiorna(1/60); }
    if(inAttesa) entra();
    requestAnimationFrame(function(t){ ultimo=t; requestAnimationFrame(ciclo); });
  }
  var pronto=(document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('800 100px "Baloo 2"'), new Promise(function(r){ setTimeout(r,2500); })])
    : Promise.resolve();
  pronto.then(avvia,avvia);

  // ---- la porta: il browser non fa partire l'audio senza un clic ----
  var porta=document.getElementById('porta'), entrato=false, inAttesa=false;
  if(/anteprima|salta=/.test(location.search)) porta.remove();
  function entra(){
    if(entrato || !porta.isConnected) return;
    Suono.avvia();
    if(!partito){ inAttesa=true; return; }
    entrato=true; ambiente(); ricomincia();
    porta.classList.add('via');
    setTimeout(function(){ porta.remove(); },800);
  }
  porta.addEventListener('pointerdown',entra);
  window.addEventListener('keydown',entra);

  var attesa;
  window.addEventListener('resize',function(){
    clearTimeout(attesa);
    attesa=setTimeout(function(){ if(partito){ misura(); iniziaScrittura(); } },250);
  });
})();
</script>
