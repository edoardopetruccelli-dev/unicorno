<body>
<canvas id="fondo"></canvas>
<svg id="volpe" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="coda" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e6e0ff"/><stop offset=".55" stop-color="#ffffff"/>
      <stop offset=".82" stop-color="#bfe6ff"/><stop offset="1" stop-color="#5cc2ff"/>
    </linearGradient>
    <linearGradient id="manto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc7ef"/>
    </linearGradient>
  </defs>
  <g id="code"></g>
  <path d="M150 205 C188 192 236 214 238 256 C240 282 220 294 188 294 L146 294 Z" fill="url(#manto)"/>
  <path d="M196 228 C208 240 208 256 198 264 C202 250 198 240 188 234 Z" fill="#e0405a" opacity=".85"/>
  <path d="M112 146 C98 178 100 240 106 294 L164 294 C186 262 192 230 178 200 C166 176 152 158 142 136 Z" fill="url(#manto)"/>
  <path d="M106 150 C90 172 92 202 110 218 C118 200 126 176 124 152 Z" fill="#ffffff"/>
  <path d="M108 236 C106 256 106 280 108 292 L122 292 C122 276 122 256 124 238 Z" fill="url(#manto)"/>

  <ellipse cx="114" cy="293" rx="10" ry="4.5" fill="#e6e0ff"/>
  <ellipse cx="139" cy="293" rx="10" ry="4.5" fill="#e6e0ff"/>
  <g id="testa">
    <path d="M106 100 L96 56 L128 92 Z" fill="url(#manto)"/>
    <path d="M108 94 L101 66 L121 90 Z" fill="#e0405a"/>
    <path d="M124 98 L132 58 L146 106 Z" fill="url(#manto)"/>
    <path d="M128 96 L133 68 L142 102 Z" fill="#e0405a"/>
    <path d="M148 128 C142 104 124 92 104 94 C88 96 74 108 52 124 C68 132 86 138 104 138 C124 140 142 140 148 128 Z" fill="url(#manto)"/>
    <path d="M148 126 C154 142 144 156 126 154 C134 146 140 138 148 126 Z" fill="#ffffff"/>
    <path d="M118 97 C113 89 115 83 120 78 C122 85 124 91 118 97 Z" fill="#e0405a"/>
    <path d="M86 103 C96 97 108 97 118 103" fill="none" stroke="#e0405a" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 121 C110 123 118 121 126 115" fill="none" stroke="#e0405a" stroke-width="2.4" stroke-linecap="round"/>
    <g id="occhio">
      <path d="M90 110 C95 104 105 104 110 110 C104 114 96 114 90 110 Z" fill="#ffcf4a"/>
      <ellipse cx="100" cy="109.5" rx="1.6" ry="3.4" fill="#1a0a20"/>
    </g>
    <ellipse cx="53" cy="123" rx="4" ry="3.2" fill="#2a1030"/>
    <path d="M58 129 C68 134 78 134 88 132" fill="none" stroke="#bdb2dc" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
<canvas id="scena"></canvas>
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  var fondo=$('fondo'), fctx=fondo.getContext('2d'), tela=$('scena'), ctx=tela.getContext('2d');
  var volpe=$('volpe'), testa=$('testa'), occhio=$('occhio'), gCode=$('code');
  var ANTEPRIMA=/anteprima/.test(location.search);
  var ridotto=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var FONT='"Dela Gothic One","Arial Black",Impact,sans-serif';
  var PAROLA='SEI UN COGLIONE';
  var NC=9, PERNO=[210,252], PUNTA=[26,-150];
  var W=0,H=0,dpr=1,fx=0,fy=0,fz=300;
  var code=[], angoli=[], fiamme=[], scintille=[], foglie=[], sprite=[], NH=16;
  var passo=8, colore=0, inclina=0;
  var fase='nasce', tFase=0, tempo=0, ultimo=0, fineNascita=0;

  function caso(s){ return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
  function righe(t,max){
    var out=[],cur='';
    t.split(' ').forEach(function(p){
      if(!cur) cur=p;
      else if((cur+' '+p).length<=max) cur+=' '+p;
      else { out.push(cur); cur=p; }
    });
    if(cur) out.push(cur);
    return out;
  }
  function liscio(u){ u=Math.max(0,Math.min(1,u)); return u*u*(3-2*u); }

  // ---- le nove code ----
  function creaCode(){
    var ns='http://www.w3.org/2000/svg';
    for(var i=0;i<NC;i++){
      var g=document.createElementNS(ns,'g'), p=document.createElementNS(ns,'path');
      p.setAttribute('d','M-10 0 C-24 -36 -26 -90 -8 -130 C0 -150 22 -160 32 -148 C24 -124 22 -76 14 -36 C12 -20 8 -6 6 0 Z');
      p.setAttribute('fill','url(#coda)'); p.setAttribute('stroke','#d8d0f5'); p.setAttribute('stroke-width','.8');
      g.appendChild(p); gCode.appendChild(g); code.push(g);
    }
  }
  function muoviCode(){
    for(var i=0;i<NC;i++){
      var a=-25+i*(90/(NC-1))+Math.sin(tempo*1.4+i*.7)*5;
      angoli[i]=a;
      code[i].setAttribute('transform','translate('+PERNO[0]+' '+PERNO[1]+') rotate('+a.toFixed(2)+')');
    }
  }
  function puntaCoda(i){
    var r=angoli[i]*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    var x=PERNO[0]+PUNTA[0]*c-PUNTA[1]*s, y=PERNO[1]+PUNTA[0]*s+PUNTA[1]*c;
    return [fx+x/300*fz, fy+y/300*fz];
  }

  // ---- i fuochi fatui ----
  function preparaSprite(){
    sprite=[];
    for(var i=0;i<NH;i++){
      var h=(200+i*12)%360, c=document.createElement('canvas'); c.width=64; c.height=96;
      var g=c.getContext('2d');
      var al=g.createRadialGradient(32,60,0,32,60,32);
      al.addColorStop(0,'hsla('+h+',100%,70%,.55)'); al.addColorStop(1,'hsla('+h+',100%,60%,0)');
      g.fillStyle=al; g.fillRect(0,0,64,96);
      g.beginPath(); g.moveTo(32,8); g.bezierCurveTo(38,30,50,42,50,60); g.bezierCurveTo(50,78,14,78,14,60); g.bezierCurveTo(14,42,26,30,32,8); g.closePath();
      var gr=g.createRadialGradient(32,62,0,32,58,30);
      gr.addColorStop(0,'hsla('+h+',100%,97%,1)'); gr.addColorStop(.35,'hsla('+h+',100%,75%,.95)'); gr.addColorStop(1,'hsla('+h+',100%,55%,0)');
      g.fillStyle=gr; g.fill();
      sprite.push(c);
    }
  }
  function fiamma(x,y,s,f,al,ci){
    var dh=passo*2.7*s*(1+.14*Math.sin(tempo*13+f)), dw=passo*2.7*s*64/96*(1-.07*Math.sin(tempo*11+f*2));
    ctx.globalAlpha=Math.max(0,Math.min(1,al));
    ctx.drawImage(sprite[Math.max(0,Math.min(NH-1,Math.round(ci)))],x-dw/2,y-dh*.62,dw,dh);
  }

  // ---- il paesaggio ----
  function torii(g,x,y,h,col){
    var w=h*1.1; g.fillStyle=col;
    g.fillRect(x-w*.36,y-h*.85,h*.07,h*.85); g.fillRect(x+w*.36-h*.07,y-h*.85,h*.07,h*.85);
    g.beginPath(); g.moveTo(x-w*.62,y-h*.97); g.quadraticCurveTo(x,y-h*.86,x+w*.62,y-h*.97);
    g.lineTo(x+w*.56,y-h*.86); g.quadraticCurveTo(x,y-h*.8,x-w*.56,y-h*.86); g.closePath(); g.fill();
    g.fillRect(x-w*.5,y-h*.84,w,h*.05);
    g.fillRect(x-w*.48,y-h*.68,w*.96,h*.05);
    g.fillRect(x-h*.03,y-h*.82,h*.06,h*.14);
  }
  function disegnaFondo(){
    fondo.width=Math.round(W*dpr); fondo.height=Math.round(H*dpr);
    var g=fctx; g.setTransform(dpr,0,0,dpr,0,0);
    var r=caso(9), i, x, m=Math.min(W,H);
    var cielo=g.createLinearGradient(0,0,0,H);
    cielo.addColorStop(0,'#030616'); cielo.addColorStop(.5,'#0a1433'); cielo.addColorStop(.8,'#1a2352'); cielo.addColorStop(1,'#2b2a5c');
    g.fillStyle=cielo; g.fillRect(0,0,W,H);
    g.fillStyle='#eef2ff';
    for(i=Math.round(W*H/3600);i>0;i--){ g.globalAlpha=.15+.65*r(); var s=r()*1.5+.4; g.fillRect(r()*W,r()*H*.75,s,s); }
    g.globalAlpha=1;
    var lx=W<600?W*.25:W*.17, ly=H*.2, lr=m*(W<600?.15:.13);
    var alone=g.createRadialGradient(lx,ly,lr*.9,lx,ly,lr*3.5);
    alone.addColorStop(0,'rgba(150,180,255,.3)'); alone.addColorStop(1,'rgba(150,180,255,0)');
    g.fillStyle=alone; g.fillRect(0,0,W,H);
    var disco=g.createRadialGradient(lx-lr*.3,ly-lr*.3,lr*.1,lx,ly,lr);
    disco.addColorStop(0,'#ffffff'); disco.addColorStop(.7,'#dfe7ff'); disco.addColorStop(1,'#b7c6f5');
    g.fillStyle=disco; g.beginPath(); g.arc(lx,ly,lr,0,Math.PI*2); g.fill();
    // il monte
    var mx=W*.4, base=H*.84, mh=H*.3, mw=W*.42;
    var monte=g.createLinearGradient(0,base-mh,0,base);
    monte.addColorStop(0,'#3a4a8c'); monte.addColorStop(.45,'#24306a'); monte.addColorStop(1,'#141c45');
    g.fillStyle=monte;
    g.beginPath(); g.moveTo(mx-mw,base); g.quadraticCurveTo(mx-mw*.3,base-mh*.55,mx-mw*.12,base-mh);
    g.lineTo(mx+mw*.12,base-mh); g.quadraticCurveTo(mx+mw*.3,base-mh*.55,mx+mw,base); g.closePath(); g.fill();
    g.fillStyle='rgba(215,224,255,.85)';
    g.beginPath(); g.moveTo(mx-mw*.12,base-mh); g.lineTo(mx+mw*.12,base-mh); g.lineTo(mx+mw*.2,base-mh*.78);
    [[.13,.72],[.06,.8],[0,.7],[-.07,.8],[-.13,.73],[-.2,.78]].forEach(function(p){ g.lineTo(mx+mw*p[0],base-mh*p[1]); });
    g.closePath(); g.fill();
    // nebbia bassa
    for(i=0;i<4;i++){
      var ny=H*(.7+i*.05), nb=g.createLinearGradient(0,ny-H*.03,0,ny+H*.03);
      nb.addColorStop(0,'rgba(120,140,220,0)'); nb.addColorStop(.5,'rgba(120,140,220,.07)'); nb.addColorStop(1,'rgba(120,140,220,0)');
      g.fillStyle=nb; g.fillRect(0,ny-H*.03,W,H*.06);
    }
    // colline e torii
    g.fillStyle='#0a1230';
    g.beginPath(); g.moveTo(0,H);
    for(x=0;x<=W+20;x+=20) g.lineTo(x,H*.86-Math.sin(x/W*4+.5)*H*.035);
    g.lineTo(W,H); g.closePath(); g.fill();
    torii(g,W*(W<600?.3:.55),H*.86-Math.sin(.55*4+.5)*H*.035+2,H*.13,'#5a1626');
    g.fillStyle='#040714';
    g.beginPath(); g.moveTo(0,H);
    for(x=0;x<=W+20;x+=20) g.lineTo(x,H*.93-Math.sin(x/W*6+2)*H*.015);
    g.lineTo(W,H); g.closePath(); g.fill();
    // la roccia della volpe
    var rx=fx+fz*.55, ry=fy+fz*.98;
    g.fillStyle='#0b1430';
    g.beginPath(); g.ellipse(rx,ry+fz*.06,fz*.42,fz*.1,0,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(160,190,255,.2)'; g.lineWidth=2;
    g.beginPath(); g.ellipse(rx,ry+fz*.06,fz*.42,fz*.1,0,Math.PI*1.05,Math.PI*1.95); g.stroke();
  }
  function acero(x,y,s,rot,col){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s); ctx.fillStyle=col;
    ctx.beginPath();
    for(var k=0;k<10;k++){ var a=-Math.PI/2+k*Math.PI/5, rr=k%2?4:10; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,9); ctx.stroke();
    ctx.restore();
  }

  // ---- la frase ----
  function preparaParola(){
    var lin=righe(PAROLA,W<600?10:16);
    var off=document.createElement('canvas'); off.width=W; off.height=H;
    var o=off.getContext('2d',{willReadFrequently:true});
    o.font='100px '+FONT;
    var largo=1;
    lin.forEach(function(l){ largo=Math.max(largo,o.measureText(l).width); });
    var fs=Math.min(100*W*.86/largo,H*(W<600?.22:.32)/lin.length,200), cy=W<600?H*.3:H*.4;
    o.font=fs+'px '+FONT; o.textAlign='center'; o.textBaseline='middle'; o.fillStyle='#fff';
    lin.forEach(function(l,i){ o.fillText(l,W/2,cy+(i-(lin.length-1)/2)*fs*1.08); });
    var d=o.getImageData(0,0,W,H).data, lista;
    passo=Math.max(4,Math.round(fs/18));
    for(;;){
      lista=[];
      for(var y=0;y<H;y+=passo) for(var x=0;x<W;x+=passo)
        if(d[(y*W+x)*4+3]>140) lista.push({tx:x+(Math.random()-.5)*passo*.35,ty:y+(Math.random()-.5)*passo*.35});
      if(lista.length>900) passo++; else break;
    }
    lista.forEach(function(b){ b.f=Math.random()*6.283; b.coda=Math.floor(Math.random()*NC); });
    fiamme=lista;
  }
  function iniziaNascita(){
    fase='nasce'; tFase=0; colore=0; fineNascita=0;
    var sparse=ridotto?2.4:3.8;
    fiamme.forEach(function(b){
      b.stato=0; b.t0=Math.random()*sparse; b.dur=1.8+Math.random()*.9; b.al=1; b.s=.4;
      b.amp=15+Math.random()*40; b.nw=2+Math.random()*2;
      fineNascita=Math.max(fineNascita,b.t0+b.dur);
    });
  }
  function sali(){
    fase='sale'; tFase=0;
    fiamme.forEach(function(b){ b.stato=3; b.vy=-(60+Math.random()*150); b.vx=(Math.random()-.5)*40; });
    foglie.forEach(function(l){ l.vx+=60+Math.random()*80; });
  }

  function misura(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    [fondo,tela].forEach(function(c){ c.style.width=W+'px'; c.style.height=H+'px'; });
    tela.width=Math.round(W*dpr); tela.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    fz=W<600?W*.6:Math.min(H*.5,W*.33);
    fx=W-fz*(W<600?1.08:1.22); fy=H*.955-fz;
    volpe.style.width=fz+'px'; volpe.style.height=fz+'px';
    volpe.style.transform='translate('+fx.toFixed(1)+'px,'+fy.toFixed(1)+'px)';
    disegnaFondo();
    foglie=[];
    var col=['#d7263d','#f46036','#c81d25','#ff8c42'];
    for(var i=0;i<26;i++) foglie.push({x:Math.random()*W,y:Math.random()*H,vy:18+Math.random()*30,vx:6+Math.random()*14,rot:Math.random()*6.28,vr:(Math.random()-.5)*2.4,s:(.6+Math.random()*.8)*Math.max(.8,Math.min(W,H)/700),c:col[i%4],ph:Math.random()*6.28});
    muoviCode();
    if(ANTEPRIMA) preparaAnteprima();
    else { preparaParola(); iniziaNascita(); }
  }
  function preparaAnteprima(){
    fase='anteprima'; passo=Math.min(W,H)*.03; fiamme=[];
    for(var i=0;i<46;i++){
      var p=puntaCoda(i%NC), t=Math.random();
      fiamme.push({x:p[0]-t*W*.75+(Math.random()-.5)*W*.06,y:p[1]-Math.sin(t*Math.PI)*H*.35+(Math.random()-.5)*H*.2,s:.6+Math.random()*.7,f:Math.random()*6.28,stato:2});
    }
  }

  function aggiorna(dt){
    tFase+=dt;
    muoviCode();
    occhio.setAttribute('transform',((tempo+1)%4.3)<.12?'translate(0 109) scale(1 .1) translate(0 -109)':'');
    foglie.forEach(function(l){
      l.y+=l.vy*dt; l.x+=(l.vx+Math.sin(tempo+l.ph)*20)*dt; l.rot+=l.vr*dt;
      if(l.vx>20) l.vx-=dt*25;
      if(l.y>H+20 || l.x>W+30){ l.y=-20; l.x=Math.random()*W*.9-W*.1; }
    });
    for(var i=scintille.length-1;i>=0;i--){
      var s=scintille[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vita-=dt/.9;
      if(s.vita<=0) scintille.splice(i,1);
    }
    if(ANTEPRIMA) return;
    if(fase==='nasce'){
      fiamme.forEach(function(b){
        var u=(tFase-b.t0)/b.dur;
        if(u<0){ b.stato=0; return; }
        if(b.stato===0){ var p=puntaCoda(b.coda); b.sx=p[0]; b.sy=p[1]; b.cx=(b.sx+b.tx)/2+(Math.random()-.5)*W*.25; b.cy=Math.min(b.sy,b.ty)-Math.random()*H*.3; b.stato=1; }
        if(u>=1){ b.stato=2; b.s=1; b.x=b.tx; b.y=b.ty; return; }
        var e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, m=1-e;
        b.x=m*m*b.sx+2*m*e*b.cx+e*e*b.tx+Math.sin(u*Math.PI*b.nw+b.f)*b.amp*(1-e);
        b.y=m*m*b.sy+2*m*e*b.cy+e*e*b.ty;
        b.s=.4+.6*e;
        if(Math.random()<dt*5) scintille.push({x:b.x,y:b.y,vx:(Math.random()-.5)*20,vy:-15-Math.random()*25,vita:1});
      });
      if(tFase>fineNascita+.3){ fase='resta'; tFase=0; }
    } else if(fase==='resta'){
      fiamme.forEach(function(b){ b.x=b.tx; b.y=b.ty+Math.sin(tempo*2+b.f)*passo*.18; });
      inclina=tFase<1.2?0:tFase<1.7?liscio((tFase-1.2)/.5)*18:tFase<3.4?18:18*(1-liscio((tFase-3.4)/.5));
      if(tFase>1.4) colore=Math.min(NH-1,(tFase-1.4)/1.4*(NH-1));
      if(tFase>(ridotto?6.5:5.5)) sali();
    } else if(fase==='sale'){
      inclina=0;
      fiamme.forEach(function(b){
        b.vy-=40*dt; b.x+=(b.vx+Math.sin(tempo*2+b.f)*30)*dt; b.y+=b.vy*dt;
        b.s=Math.max(.2,b.s-dt*.25); b.al-=dt/2.4;
      });
      if(tFase>2.8) iniziaNascita();
    }
    testa.setAttribute('transform',inclina?'rotate('+inclina.toFixed(2)+' 140 140)':'');
  }

  function disegna(){
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.clearRect(0,0,W,H);
    foglie.forEach(function(l){ acero(l.x,l.y,l.s,l.rot,l.c); });
    ctx.globalCompositeOperation='lighter';
    var ci=fase==='anteprima'?0:colore;
    for(var i=0;i<fiamme.length;i++){
      var b=fiamme[i];
      if(b.stato===0) continue;
      fiamma(b.x,b.y,b.s,b.f,b.stato===3?b.al:1,ci);
    }
    ctx.fillStyle='#bfe6ff';
    scintille.forEach(function(s){ ctx.globalAlpha=Math.max(0,s.vita)*.8; ctx.fillRect(s.x,s.y,2,2); });
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  }

  function ciclo(ora){
    var dt=Math.min(.05,Math.max(0,(ora-ultimo)/1000));
    ultimo=ora; tempo+=dt;
    aggiorna(dt); disegna();
    requestAnimationFrame(ciclo);
  }
  var partito=false;
  function avvia(){
    if(partito) return; partito=true;
    creaCode(); preparaSprite(); misura();
    var salta=/salta=([\d.]+)/.exec(location.search);
    if(salta) for(var i=Math.round(parseFloat(salta[1])*60);i>0;i--){ tempo+=1/60; aggiorna(1/60); }
    requestAnimationFrame(function(t){ ultimo=t; requestAnimationFrame(ciclo); });
  }
  var pronto=(document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('100px "Dela Gothic One"'),new Promise(function(r){ setTimeout(r,2500); })])
    : Promise.resolve();
  pronto.then(avvia,avvia);

  var attesa;
  window.addEventListener('resize',function(){
    clearTimeout(attesa);
    attesa=setTimeout(function(){ if(partito) misura(); },250);
  });
})();
</script>
</body>
</html>
